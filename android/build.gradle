plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.spline'
version = '0.1.0'

android {
  namespace "expo.modules.spline"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Pin the Spline runtime and add the AndroidX lifecycle pieces it relies on.
  // spline-runtime 0.2.3 publishes these as runtime-only deps, which breaks
  // compilation here because SplineView implements DefaultLifecycleObserver.
  implementation("design.spline:spline-runtime:0.2.3")
  implementation("androidx.lifecycle:lifecycle-common-java8:2.6.2")
  implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.2")
}
