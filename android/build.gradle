plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.spline'
version = '0.1.0'

android {
  namespace "expo.modules.spline"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Spline 3D runtime — required to compile ReactNativeSplineView.kt
  // Hosted on Maven Central: https://central.sonatype.com/artifact/design.spline/spline-runtime/overview
  implementation("design.spline:spline-runtime:+")
}
